name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  detection-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
      - run: npm run report      # fails the build on detection/FP regression
      - run: npm run build
