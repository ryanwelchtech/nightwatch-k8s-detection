# Drop-in containment: deny-all ingress/egress for a compromised pod.
# kubectl label pod <pod> quarantine=true  then apply this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: quarantine, namespace: production }
spec:
  podSelector: { matchLabels: { quarantine: "true" } }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
